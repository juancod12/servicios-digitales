<!doctype html>
<!-- Plantilla de la imagen para compartir (Open Graph). Se captura a 1200x630 con:
     node scripts/captura.mjs http://localhost:5500/scripts/og.html assets/og/og-image.jpg 1200 630 1 -->
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../css/app.css">
<style>
  body { margin:0; width:1200px; height:630px; overflow:hidden; }
  .og { position:relative; width:1200px; height:630px; display:grid; grid-template-columns: 1.15fr 0.85fr; align-items:center; padding:0 72px; box-sizing:border-box; color:var(--color-blanco); }
  .og h1 { font-size:58px; margin:28px 0 0; max-width:640px; }
  .og p { font-size:24px; color:var(--color-gris-claro); margin:22px 0 0; max-width:560px; }
  .og .precio { display:inline-block; margin-top:34px; padding:12px 22px; border-radius:999px; background:var(--color-coral); color:var(--color-carbon); font-family:var(--font-display); font-weight:700; font-size:22px; }
  .og .tel { position:relative; justify-self:center; width:250px; transform:rotate(6deg); }
</style></head>
<body>
  <div class="og malla-carbon trama-puntos isolate">
    <div>
      <img src="../assets/logo/menufast-logo-claro.png" alt="" style="height:78px">
      <h1>Tu carta en el celular de tus clientes, con el estilo de tu negocio</h1>
      <p>Menús digitales con fotos, precios, categorías y código QR.</p>
      <span class="precio">Planes desde $100.000 · pago único</span>
    </div>
    <div class="telefono tel"><div class="telefono__pantalla"><img src="../assets/img/capturas/basico-inicio-780.webp" alt="" style="width:100%;height:100%;object-fit:cover;object-position:top"></div></div>
  </div>
</body></html>
